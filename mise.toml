[tasks.preflight]
description = "Names a missing Rust toolchain or cargo-nextest before a build turns it into an obscure error"
dir = "{{config_root}}"
run = [
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
]

[tasks.check]
description = "cargo check, clippy with warnings denied, and rustfmt check over the workspace"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.test]
description = "Every workspace test through cargo-nextest"
dir = "{{config_root}}"
run = "cargo nextest run --workspace"

[tasks.bench]
description = "Criterion benches for the per-frame hot paths; arguments narrow the run"
dir = "{{config_root}}"
run = "cargo bench -p heads-bench --bench heads --"

[tasks.build-mod]
description = "Builds the AMML mod into dist/@alaydriem/heads (alaydriem_heads.dll, its pdb and amml.hcl)"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
cargo build --release -p heads-amml
rm -rf dist/alaydriem-heads
mkdir -p dist/@alaydriem/heads
cp target/release/alaydriem_heads.dll dist/@alaydriem/heads/alaydriem_heads.dll
cp target/release/alaydriem_heads.pdb dist/@alaydriem/heads/alaydriem_heads.pdb
cp heads/amml/amml.hcl dist/@alaydriem/heads/amml.hcl
echo "built dist/@alaydriem/heads"
'''

[tasks.package]
description = "Builds the mod and checks that dist/@alaydriem/heads holds exactly the dll, the pdb and amml.hcl"
depends = ["build-mod"]
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
count=$(ls dist/@alaydriem/heads | wc -l)
if [ "$count" -ne 3 ]; then echo "expected 3 files in dist/@alaydriem/heads, found $count"; exit 1; fi
ls -l dist/@alaydriem/heads
'''
