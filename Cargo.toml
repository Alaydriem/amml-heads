[workspace]
resolver = "3"
members = ["src/core", "src/amml", "src/bench"]

[workspace.package]
version = "26.62.0"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
amm-client = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.3", default-features = false }
amm-core = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.3" }
amml-sdk = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.3" }
amml-game = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.3" }
amml-msvc = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.3" }
crossbeam-channel = "0.5.17"
curia = "=0.2.2"
heads-core = { path = "src/core" }
criterion = { version = "0.5", default-features = false }
hcl-rs = "=0.19.8"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
